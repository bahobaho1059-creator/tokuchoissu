<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffaf0">
<title>得チョイっす。</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#fffaf0;
  color:#4c3b2e
}

body{
  display:flex;
  justify-content:center
}

#app{
  position:relative;
  width:min(100vw,711px);
  min-height:100dvh;
  overflow-x:hidden;
  background:#fffaf0
}

.screen{
  position:relative;
  width:100%;
  min-height:100dvh;
  background-size:100% auto;
  background-repeat:no-repeat;
  background-position:top center
}

#start{
  background-image:url("assets/fix1.jpeg");
  aspect-ratio:711/1536
}

#input{
  display:none;
  background-image:url("assets/fix2.jpeg");
  aspect-ratio:711/1536
}

#result{
  display:none;
  background-image:url("assets/FIX3-final.PNG");
  aspect-ratio:711/1536
}

.hit{
  position:absolute;
  border:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent
}

.start-btn{
  left:26%;
  top:53.6%;
  width:48%;
  height:7.4%
}

.back-btn{
  left:2%;
  top:1%;
  width:17%;
  height:9%
}

.compare-btn{
  left:23%;
  top:78%;
  width:55%;
  height:8%
}

.home-btn{
  left:8%;
  bottom:0;
  width:25%;
  height:8%
}

.again-btn{
  left:44%;
  top:82%;
  width:50%;
  height:7%
}

.edit-btn{
  left:5%;
  top:82%;
  width:37%;
  height:7%
}

.field{
  position:absolute;
  border:0;
  outline:none;
  background:rgba(255,255,255,.02);
  font-size:clamp(18px,5.3vw,38px);
  text-align:right;
  color:#4a443d;
  padding:0 12px;
  border-radius:14px
}

.field:focus{
  background:rgba(255,255,255,.65)
}

#rp{
  left:9%;
  top:37.3%;
  width:32%;
  height:6.2%
}

#rq{
  left:51%;
  top:37.3%;
  width:24%;
  height:6.2%
}

#bp{
  left:9%;
  top:57.8%;
  width:32%;
  height:6.2%
}

#bq{
  left:51%;
  top:57.8%;
  width:24%;
  height:6.2%
}

select.unit{
  position:absolute;
  border:0;
  outline:none;
  background:transparent;
  font-weight:700;
  color:#4c3b2e;
  font-size:clamp(16px,4.5vw,30px);
  appearance:none;
  text-align:center
}

#ru{
  left:76%;
  top:37.3%;
  width:14%;
  height:6.2%
}

#bu{
  left:76%;
  top:57.8%;
  width:14%;
  height:6.2%
}

.dynamic{
  position:absolute;
  z-index:3;
  text-align:center;
  font-weight:700;
  pointer-events:none
}

/* FIX3-final alignment pass 10 — Fx動作保証版から表示のみ修正 */
#winner{
  left:22.2%;
  top:27.45%;
  width:30.8%;
  font-size:clamp(20px,5.4vw,35px);
  font-weight:800;
  line-height:1.06;
  white-space:nowrap
}


#winnerFrame{
  position:absolute;
  left:7.3%;
  top:23.45%;
  width:85.4%;
  height:17.05%;
  border:0 solid transparent;
  border-radius:24px;
  z-index:4;
  pointer-events:none
}

#saving{
  left:42.0%;
  top:37.16%;
  width:17.0%;
  font-size:clamp(13px,3.58vw,24px);
  line-height:1.08
}


#savingLabel{
  left:23.5%;
  top:37.16%;
  width:20.5%;
  font-size:clamp(13px,3.45vw,23px);
  line-height:1.08;
  color:#4c3b2e;
  white-space:nowrap
}

#runit,
#bunit{
  top:49.22%;
  width:25.5%;
  font-size:clamp(20px,5.28vw,35px);
  line-height:1.06
}

#runit{
  left:14.7%;
  color:#ef8376
}

#bunit{
  left:58.7%;
  color:#79b7df
}


#rlabel,
#blabel{
  top:46.28%;
  width:26.0%;
  font-size:clamp(9px,2.15vw,15px);
  line-height:1.05;
  white-space:nowrap
}

#rlabel{
  left:12.2%;
  color:#e53935
}

#blabel{
  left:55.4%;
  color:#168fe8
}



.detail-value{
  font-size:clamp(12px,3.4vw,23px);
  color:#4c3b2e;
  line-height:1.1
}



#sameQtyLabelCover{
  position:absolute;
  left:36.7%;
  top:68.62%;
  width:24.6%;
  height:3.0%;
  background:#fbfaf6;
  z-index:2;
  pointer-events:none
}

#sameQtyLabel{
  left:36.7%;
  top:69.30%;
  width:24.6%;
  font-size:clamp(10px,2.6vw,18px);
  color:#2aa33d;
  line-height:1.05;
  text-align:center;
  white-space:nowrap
}


/* Pass 12: 下段中央の単価ラベルはFIX③の固定文字をそのまま使用。
   DOMはJS互換性維持のため残し、表示だけ無効化する。 */
#detailUnitLabel{
  display:none
}

#rprice,#bprice{top:57.72%;width:14%}
#rqty,#bqty{top:61.55%;width:14%}
#rdetailunit,#bdetailunit{top:65.42%;width:14%}

#rprice,#rqty,#rdetailunit{left:10.0%}
#bprice,#bqty,#bdetailunit{left:65.0%}


/* 総額差・お得率 */
.result-metric{
  font-size:clamp(12px,3.2vw,22px);
  color:#4c3b2e;
  line-height:1.08
}

#rtotaldiff,#btotaldiff{
  top:69.30%;
  width:13.3%
}

#rrate,#brate{
  top:73.14%;
  width:13.3%
}

#rtotaldiff,#rrate{left:10.2%}
#btotaldiff,#brate{left:65.4%}

/*
  FIX3-finalには左側だけ「円お得」「%お得」が固定で残っている。
  勝者側へ動的に出すため、その固定文字だけ白で隠し、
  HTML側から左右どちらにも出せるようにする。
*/
.metric-suffix-cover{
  position:absolute;
  left:21.2%;
  width:14.2%;
  height:2.55%;
  background:#fffdf8;
  z-index:2;
  pointer-events:none
}

#totalSuffixCover{top:68.92%}
#rateSuffixCover{top:72.78%}

.metric-suffix{
  font-size:clamp(10px,2.6vw,18px);
  color:#4c3b2e;
  line-height:1.08;
  white-space:nowrap
}

#rtotalSuffix{left:21.0%;top:69.30%;width:13.8%}
#rrateSuffix{left:21.0%;top:73.14%;width:13.8%}
#btotalSuffix{left:79.5%;top:69.30%;width:13.0%}
#brateSuffix{left:79.5%;top:73.14%;width:13.0%}

/*
  旧背景用coverはFIX3-finalでは不要。
  要素/CSS定義自体は削除せず、影響確認のため無効化だけする。
*/
.cover{
  display:none;
  position:absolute;
  background:#fffdf8;
  z-index:2;
  pointer-events:none
}

#wincover{
  left:18%;
  top:23.5%;
  width:57%;
  height:14%;
  border-radius:20px
}

#rcover{
  left:10%;
  top:48%;
  width:34%;
  height:7%
}

#bcover{
  left:56%;
  top:48%;
  width:34%;
  height:7%
}

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  overflow:hidden
}

.confetti i{
  position:absolute;
  top:-20px;
  width:8px;
  height:14px;
  background:currentColor;
  animation:fall 1.1s linear forwards
}

@keyframes fall{
  to{
    transform:translate3d(var(--x),105vh,0) rotate(720deg);
    opacity:.2
  }
}

@media(min-width:712px){
  #app{
    box-shadow:0 0 40px rgba(0,0,0,.12)
  }
}

.field{
  background:
    linear-gradient(#fffdf8,#fffdf8)
    82% 50% / 24% 66%
    no-repeat !important;
  border:none !important;
  box-shadow:none !important;
}

select.unit{
  background:
    linear-gradient(#fffdf8,#fffdf8)
    36% 50% / 46% 66%
    no-repeat !important;
  border:none !important;
  box-shadow:none !important;
}

/* Pass 9: FIX③の矩形を正式な数値表示欄として使用 */
#runit,
#bunit{
  background:transparent !important;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
}

</style>
</head>

<body>
<main id="app">

<section id="start" class="screen">
  <button class="hit start-btn" aria-label="はじめる"></button>
</section>

<section id="input" class="screen">
  <button class="hit back-btn" aria-label="もどる"></button>

  <input id="rp" class="field" inputmode="decimal" aria-label="赤コーナー価格">
  <input id="rq" class="field" inputmode="decimal" aria-label="赤コーナー内容量">

  <select id="ru" class="unit" aria-label="赤コーナー単位">
    <option>g</option>
    <option>ml</option>
    <option>個</option>
  </select>

  <input id="bp" class="field" inputmode="decimal" aria-label="青コーナー価格">
  <input id="bq" class="field" inputmode="decimal" aria-label="青コーナー内容量">

  <select id="bu" class="unit" aria-label="青コーナー単位">
    <option>g</option>
    <option>ml</option>
    <option>個</option>
  </select>

  <button class="hit compare-btn" aria-label="比較する"></button>
  <button class="hit home-btn" aria-label="ホーム"></button>
</section>

<section id="result" class="screen">

  <div id="wincover" class="cover"></div>
  <div id="rcover" class="cover"></div>
  <div id="bcover" class="cover"></div>

  <div id="winnerFrame"></div>
  <div id="winner" class="dynamic"></div>
  <div id="savingLabel" class="dynamic"></div>
  <div id="saving" class="dynamic"></div>

  <div id="rlabel" class="dynamic"></div>
  <div id="blabel" class="dynamic"></div>
  <div id="runit" class="dynamic"></div>
  <div id="bunit" class="dynamic"></div>


  <div id="sameQtyLabelCover" class="detail-center-cover"></div>

  <div id="sameQtyLabel" class="dynamic detail-center-label">同じ量なら</div>
  <div id="detailUnitLabel" class="dynamic"></div>

  <div id="rprice" class="dynamic detail-value"></div>
  <div id="bprice" class="dynamic detail-value"></div>
  <div id="rqty" class="dynamic detail-value"></div>
  <div id="bqty" class="dynamic detail-value"></div>
  <div id="rdetailunit" class="dynamic detail-value"></div>
  <div id="bdetailunit" class="dynamic detail-value"></div>

  <div id="totalSuffixCover" class="metric-suffix-cover"></div>
  <div id="rateSuffixCover" class="metric-suffix-cover"></div>

  <div id="rtotaldiff" class="dynamic result-metric"></div>
  <div id="btotaldiff" class="dynamic result-metric"></div>
  <div id="rrate" class="dynamic result-metric"></div>
  <div id="brate" class="dynamic result-metric"></div>

  <div id="rtotalSuffix" class="dynamic metric-suffix"></div>
  <div id="btotalSuffix" class="dynamic metric-suffix"></div>
  <div id="rrateSuffix" class="dynamic metric-suffix"></div>
  <div id="brateSuffix" class="dynamic metric-suffix"></div>

  <button class="hit back-btn" aria-label="もどる"></button>
  <button class="hit edit-btn" aria-label="入力に戻って修正"></button>
  <button class="hit again-btn" aria-label="もう一度比較する"></button>
  <button class="hit home-btn" aria-label="ホーム"></button>

</section>

</main>

<script>
const $=s=>document.querySelector(s);

const screens={
  start:$("#start"),
  input:$("#input"),
  result:$("#result")
};

function show(name){
  Object.values(screens).forEach(x=>x.style.display="none");
  screens[name].style.display="block";
  scrollTo(0,0);
}

$(".start-btn").onclick=()=>show("input");

screens.input.querySelector(".back-btn").onclick=()=>show("start");
screens.input.querySelector(".home-btn").onclick=()=>show("start");

screens.result.querySelector(".back-btn").onclick=()=>show("input");
$(".edit-btn").onclick=()=>show("input");

$(".again-btn").onclick=()=>{
  ["#rp","#rq","#bp","#bq"].forEach(x=>$(x).value="");
  show("input");
};

screens.result.querySelector(".home-btn").onclick=()=>show("start");

function n(id){
  return Number($(id).value);
}

function unitLabel(unit){
  if(unit==="g") return "100gあたり";
  if(unit==="ml") return "100mlあたり";
  return "1個あたり";
}

function confetti(){
  const c=document.createElement("div");
  c.className="confetti";

  const colors=[
    "#ef8376",
    "#79b7df",
    "#a9cd7c",
    "#f0ca62"
  ];

  for(let i=0;i<38;i++){
    const e=document.createElement("i");
    e.style.left=Math.random()*100+"vw";
    e.style.color=colors[i%colors.length];
    e.style.setProperty("--x",(Math.random()*180-90)+"px");
    e.style.animationDelay=Math.random()*.22+"s";
    c.appendChild(e);
  }

  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1450);
}

$(".compare-btn").onclick=()=>{

  const rp=n("#rp");
  const rq=n("#rq");
  const bp=n("#bp");
  const bq=n("#bq");

  if(!(rp>0&&rq>0&&bp>0&&bq>0)){
    alert("価格と内容量を入力してください");
    return;
  }

  if($("#ru").value!==$("#bu").value){
    alert("同じ単位（g同士 / ml同士 / 個同士）で比較してください");
    return;
  }

  const unit=$("#ru").value;
  const base=unit==="個" ? 1 : 100;
  const label=unitLabel(unit);

  const r=rp/rq*base;
  const b=bp/bq*base;

  const red=r<=b;
  const diff=Math.abs(r-b);

  $("#winner").textContent = red ? "赤コーナー" : "青コーナー";
  $("#winner").style.color = red ? "#e53935" : "#168fe8";
  $("#winnerFrame").style.borderColor = red ? "#e53935" : "#168fe8";

  $("#rlabel").textContent=`${label}の単価`;
  $("#blabel").textContent=`${label}の単価`;
  $("#detailUnitLabel").textContent=`${label}の単価`;

  /*
    FIX3-final側に「円お得！」が残っているため、
    ここでは「比較単位 + 差額」だけを動的表示する。
  */
  $("#savingLabel").textContent=label;
  $("#saving").textContent=diff.toFixed(1);

  /*
    FIX③のカード内ラベル・薄い矩形・「円」は背景固定。
    HTML側は単価数値だけを矩形中央へ表示する。
  */
  $("#runit").textContent=r.toFixed(1);
  $("#bunit").textContent=b.toFixed(1);

  /*
    FIX③の「くわしい比較」「価格」「内容量」
    「100g/100ml/1個あたりの単価」「お得率」は背景固定。
    HTML側は各欄へ数値だけを表示する。
  */
  $("#rprice").textContent=rp.toLocaleString();
  $("#bprice").textContent=bp.toLocaleString();
  $("#rqty").textContent=rq.toLocaleString();
  $("#bqty").textContent=bq.toLocaleString();
  $("#rdetailunit").textContent=r.toFixed(1);
  $("#bdetailunit").textContent=b.toFixed(1);

  /*
    総額差:
    内容量の多い商品と同じ量を買った場合に、
    もう一方はいくらになるかを単価から換算し、その差を表示。
    例: 50g/280円 vs 70g/350円
        70gにそろえると 392円 vs 350円 → 42円差。
  */
  const commonQty=Math.max(rq,bq);
  const redAtCommon=(r/base)*commonQty;
  const blueAtCommon=(b/base)*commonQty;
  const totalDiff=Math.abs(redAtCommon-blueAtCommon);

  /*
    お得率:
    高い方の比較単価に対して、安い方が何%安いか。
  */
  const betterRate=(diff/Math.max(r,b))*100;

  const totalText=totalDiff.toLocaleString("ja-JP",{
    minimumFractionDigits:1,
    maximumFractionDigits:1
  });
  const rateText=betterRate.toFixed(1);

  $("#rtotaldiff").textContent=red ? totalText : "";
  $("#btotaldiff").textContent=red ? "" : totalText;
  $("#rrate").textContent=red ? rateText : "";
  $("#brate").textContent=red ? "" : rateText;

  $("#rtotalSuffix").textContent=red ? "円お得" : "";
  $("#btotalSuffix").textContent=red ? "" : "円お得";
  $("#rrateSuffix").textContent=red ? "%お得" : "";
  $("#brateSuffix").textContent=red ? "" : "%お得";

  show("result");
  confetti();
};
</script>

</body>
</html>

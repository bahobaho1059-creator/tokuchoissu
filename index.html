<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffaf0">
<title>得チョイっす。</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fffaf0;color:#4c3b2e}
body{display:flex;justify-content:center}
#app{position:relative;width:min(100vw,711px);min-height:100dvh;overflow-x:hidden;background:#fffaf0}
.screen{position:relative;width:100%;min-height:100dvh;background-size:100% auto;background-repeat:no-repeat;background-position:top center}
#start{background-image:url("assets/fix1.jpeg");aspect-ratio:711/1536}
#input{display:none;background-image:url("assets/fix2.jpeg");aspect-ratio:711/1536}
#result{display:none;background-image:url("assets/fix3.jpeg");aspect-ratio:711/1536}
.hit{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.start-btn{left:26%;top:53.6%;width:48%;height:7.4%}
.back-btn{left:2%;top:1%;width:17%;height:9%}
.compare-btn{left:23%;top:78%;width:55%;height:8%}
.home-btn{left:8%;bottom:0;width:25%;height:8%}
.again-btn{left:44%;top:82%;width:50%;height:7%}
.edit-btn{left:5%;top:82%;width:37%;height:7%}
.field{position:absolute;border:0;outline:none;background:rgba(255,255,255,.02);font-size:clamp(18px,5.3vw,38px);text-align:right;color:#4a443d;padding:0 12px;border-radius:14px}
.field:focus{background:rgba(255,255,255,.65)}.unit { background:#fffdf8; }
#rp{left:9%;top:37.3%;width:32%;height:6.2%}
#rq{left:51%;top:37.3%;width:24%;height:6.2%}
#bp{left:9%;top:57.8%;width:32%;height:6.2%}
#bq{left:51%;top:57.8%;width:24%;height:6.2%}
select.unit{position:absolute;border:0;outline:none;background:transparent;font-weight:700;color:#4c3b2e;font-size:clamp(16px,4.5vw,30px);appearance:none;text-align:center}
#ru{left:76%;top:37.3%;width:14%;height:6.2%}
#bu{left:76%;top:57.8%;width:14%;height:6.2%}
.dynamic{position:absolute;z-index:3;text-align:center;font-weight:700;pointer-events:none}
#winner{left:20%;top:25.3%;width:53%;font-size:clamp(22px,6vw,42px);line-height:1.25}
#saving{left:22%;top:35.4%;width:55%;font-size:clamp(15px,4.4vw,30px)}
#runit{left:10%;top:49.7%;width:34%;font-size:clamp(20px,6vw,42px);color:#ef8376}
#bunit{left:56%;top:49.7%;width:34%;font-size:clamp(20px,6vw,42px);color:#79b7df}
#rlabel{left:10%;top:46.8%;width:34%;font-size:clamp(12px,3.3vw,22px);color:#4c3b2e}
#blabel{left:56%;top:46.8%;width:34%;font-size:clamp(12px,3.3vw,22px);color:#4c3b2e}
  .cover{position:absolute;background:#fffdf8;z-index:2;pointer-events:none}
#wincover{
  left:7%;
  top:20.5%;
  width:68%;
  height:19%;
  border-radius:20px;
}
}
#rcover{left:10%;top:48%;width:34%;height:7%}
#bcover{left:56%;top:48%;width:34%;height:7%}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;background:currentColor;animation:fall 1.1s linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),105vh,0) rotate(720deg);opacity:.2}}
@media(min-width:712px){#app{box-shadow:0 0 40px rgba(0,0,0,.12)}}
.field{
  background:
    linear-gradient(#fffdf8,#fffdf8)
    82% 50% / 24% 66%
    no-repeat !important;
  border:none !important;
  box-shadow:none !important;
}

select.unit{
  background:
    linear-gradient(#fffdf8,#fffdf8)
    36% 50% / 46% 66%
    no-repeat !important;
  border:none !important;
  box-shadow:none !important;
}
</style>
</head>
<body><main id="app">
<section id="start" class="screen">
<button class="hit start-btn" aria-label="はじめる"></button>
</section>

<section id="input" class="screen">
<button class="hit back-btn" aria-label="もどる"></button>
<input id="rp" class="field" inputmode="decimal" aria-label="赤コーナー価格">
<input id="rq" class="field" inputmode="decimal" aria-label="赤コーナー内容量">
<select id="ru" class="unit" aria-label="赤コーナー単位"><option>g</option><option>ml</option><option>個</option></select>
<input id="bp" class="field" inputmode="decimal" aria-label="青コーナー価格">
<input id="bq" class="field" inputmode="decimal" aria-label="青コーナー内容量">
<select id="bu" class="unit" aria-label="青コーナー単位"><option>g</option><option>ml</option><option>個</option></select>
<button class="hit compare-btn" aria-label="比較する"></button>
<button class="hit home-btn" aria-label="ホーム"></button>
</section>

<section id="result" class="screen">
<div id="wincover" class="cover"></div><div id="rcover" class="cover"></div><div id="bcover" class="cover"></div>
<div id="winner" class="dynamic"></div>
<div id="saving" class="dynamic"></div>
<div id="rlabel" class="dynamic"></div>
<div id="blabel" class="dynamic"></div>
<div id="runit" class="dynamic"></div><div id="bunit" class="dynamic"></div>
<button class="hit back-btn" aria-label="もどる"></button>
<button class="hit edit-btn" aria-label="入力に戻って修正"></button>
<button class="hit again-btn" aria-label="もう一度比較する"></button>
<button class="hit home-btn" aria-label="ホーム"></button>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const screens={start:$("#start"),input:$("#input"),result:$("#result")};
function show(name){Object.values(screens).forEach(x=>x.style.display="none");screens[name].style.display="block";scrollTo(0,0)}
$(".start-btn").onclick=()=>show("input");
screens.input.querySelector(".back-btn").onclick=()=>show("start");
screens.input.querySelector(".home-btn").onclick=()=>show("start");
screens.result.querySelector(".back-btn").onclick=()=>show("input");
$(".edit-btn").onclick=()=>show("input");
$(".again-btn").onclick=()=>{["#rp","#rq","#bp","#bq"].forEach(x=>$(x).value="");show("input")};
screens.result.querySelector(".home-btn").onclick=()=>show("start");
function n(id){return Number($(id).value)}
function confetti(){
 const c=document.createElement("div");c.className="confetti";
 const colors=["#ef8376","#79b7df","#a9cd7c","#f0ca62"];
 for(let i=0;i<38;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.color=colors[i%colors.length];e.style.setProperty("--x",(Math.random()*180-90)+"px");e.style.animationDelay=Math.random()*.22+"s";c.appendChild(e)}
 document.body.appendChild(c);setTimeout(()=>c.remove(),1450)
}
$(".compare-btn").onclick=()=>{
 const rp=n("#rp"),rq=n("#rq"),bp=n("#bp"),bq=n("#bq");
 if(!(rp>0&&rq>0&&bp>0&&bq>0)){alert("価格と内容量を入力してください");return}
if($("#ru").value!==$("#bu").value){alert("同じ単位（g同士 / ml同士 / 個同士）で比較してください");return}
const unit=$("#ru").value;
const base=unit==="個" ? 1 : 100;
const r=rp/rq*base,b=bp/bq*base,red=r<=b,diff=Math.abs(r-b);
const label=unit==="個" ? "1個あたり" : `100${unit}あたり`;
#rlabel{left:10%;top:47.8%;width:34%;font-size:clamp(12px,3.3vw,22px);color:#4c3b2e}
#blabel{left:56%;top:47.8%;width:34%;font-size:clamp(12px,3.3vw,22px);color:#4c3b2e}
$("#winner").innerHTML=(red?"👑 赤コーナー":"👑 青コーナー")+"の方が<br>お得です！";
$("#saving").textContent=`${base}${unit}あたり ${diff.toFixed(1)}円お得！`;
 $("#runit").textContent=r.toFixed(1)+"円";$("#bunit").textContent=b.toFixed(1)+"円";
 show("result");confetti();
};
</script></body></html>

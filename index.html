<body>
<main id="app">

<section id="start" class="screen">
  <button class="hit start-btn" aria-label="はじめる"></button>
</section>

<section id="input" class="screen">
  <button class="hit back-btn" aria-label="もどる"></button>

  <input id="rp" class="field" inputmode="decimal" aria-label="赤コーナー価格">
  <input id="rq" class="field" inputmode="decimal" aria-label="赤コーナー内容量">

  <select id="ru" class="unit" aria-label="赤コーナー単位">
    <option>g</option>
    <option>ml</option>
    <option>個</option>
  </select>

  <input id="bp" class="field" inputmode="decimal" aria-label="青コーナー価格">
  <input id="bq" class="field" inputmode="decimal" aria-label="青コーナー内容量">

  <select id="bu" class="unit" aria-label="青コーナー単位">
    <option>g</option>
    <option>ml</option>
    <option>個</option>
  </select>

  <button class="hit compare-btn" aria-label="比較する"></button>
  <button class="hit home-btn" aria-label="ホーム"></button>
</section>

<section id="result" class="screen">

  <div id="wincover" class="cover"></div>

  <div id="winnerBorder" aria-hidden="true"></div>
  <div id="winnerFrame">
    <div id="winner" class="dynamic"></div>
  </div>
  <div id="savingLabel" class="dynamic"></div>
  <div id="saving" class="dynamic"></div>

  <div id="runit" class="dynamic"></div>
  <div id="bunit" class="dynamic"></div>


  <div id="sameQtyLabelCover" class="detail-center-cover"></div>

  <div id="sameQtyLabel" class="dynamic detail-center-label">同じ量なら</div>
<div id="detailUnitLabel" class="dynamic"></div>

  <div id="rprice" class="dynamic detail-value"></div>
  <div id="bprice" class="dynamic detail-value"></div>
  <div id="rqty" class="dynamic detail-value"></div>
  <div id="bqty" class="dynamic detail-value"></div>
  <div id="rdetailunit" class="dynamic detail-value"></div>
  <div id="bdetailunit" class="dynamic detail-value"></div>
<div id="rtotaldiff" class="dynamic result-metric"></div>
  <div id="btotaldiff" class="dynamic result-metric"></div>
  <div id="rrate" class="dynamic result-metric"></div>
  <div id="brate" class="dynamic result-metric"></div>
<button class="hit back-btn" aria-label="もどる"></button>
  <button class="hit edit-btn" aria-label="入力に戻って修正"></button>
  <button class="hit again-btn" aria-label="もう一度比較する"></button>
  <button class="hit home-btn" aria-label="ホーム"></button>

</section>

</main>

<script>
const $=s=>document.querySelector(s);

const screens={
  start:$("#start"),
  input:$("#input"),
  result:$("#result")
};

function show(name){
  Object.values(screens).forEach(x=>x.style.display="none");
  screens[name].style.display="block";
  scrollTo(0,0);
}

$(".start-btn").onclick=()=>show("input");

screens.input.querySelector(".back-btn").onclick=()=>show("start");
screens.input.querySelector(".home-btn").onclick=()=>show("start");

screens.result.querySelector(".back-btn").onclick=()=>show("input");
$(".edit-btn").onclick=()=>show("input");

$(".again-btn").onclick=()=>{
  ["#rp","#rq","#bp","#bq"].forEach(x=>$(x).value="");
  show("input");
};

screens.result.querySelector(".home-btn").onclick=()=>show("start");

function n(id){
  return Number($(id).value);
}

function unitLabel(unit){
  if(unit==="g") return "100gあたり";
  if(unit==="ml") return "100mlあたり";
  return "1個あたり";
}

function confetti(){
  const c=document.createElement("div");
  c.className="confetti";

  const colors=[
    "#ef8376",
    "#79b7df",
    "#a9cd7c",
    "#f0ca62"
  ];

  for(let i=0;i<38;i++){
    const e=document.createElement("i");
    e.style.left=Math.random()*100+"vw";
    e.style.color=colors[i%colors.length];
    e.style.setProperty("--x",(Math.random()*180-90)+"px");
    e.style.animationDelay=Math.random()*.22+"s";
    c.appendChild(e);
  }

  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1450);
}

$(".compare-btn").onclick=()=>{

  const rp=n("#rp");
  const rq=n("#rq");
  const bp=n("#bp");
  const bq=n("#bq");

  if(!(rp>0&&rq>0&&bp>0&&bq>0)){
    alert("価格と内容量を入力してください");
    return;
  }

  if($("#ru").value!==$("#bu").value){
    alert("同じ単位（g同士 / ml同士 / 個同士）で比較してください");
    return;
  }

  const unit=$("#ru").value;
  const base=unit==="個" ? 1 : 100;
  const label=unitLabel(unit);

  const r=rp/rq*base;
  const b=bp/bq*base;

  const red=r<=b;
  const diff=Math.abs(r-b);

  $("#winner").textContent = red ? "赤コーナー" : "青コーナー";
  $("#winner").style.color = red ? "#e53935" : "#168fe8";
  $("#winnerBorder").style.borderColor = red ? "#e53935" : "#168fe8";

  $("#detailUnitLabel").textContent=`${label}の単価`;

  /*
    FIX3-final側に「円お得！」が残っているため、
    ここでは「比較単位 + 差額」だけを動的表示する。
  */
  $("#savingLabel").textContent=label;
  $("#saving").textContent=Math.round(diff).toLocaleString("ja-JP");

  /*
    FIX③のカード内ラベル・薄い矩形・「円」は背景固定。
    HTML側は単価数値だけを矩形中央へ表示する。
  */
  // Pass 22: 中央カードは表示時だけ1円単位へ四捨五入。
  // 内部計算値 r / b 自体は丸めず、勝者判定・詳細計算の精度を維持する。
  $("#runit").textContent=String(Math.round(r));
  $("#bunit").textContent=String(Math.round(b));

  /*
    FIX③の「くわしい比較」「価格」「内容量」
    「100g/100ml/1個あたりの単価」「お得率」は背景固定。
    HTML側は各欄へ数値だけを表示する。
  */
  $("#rprice").textContent=rp.toLocaleString();
  $("#bprice").textContent=bp.toLocaleString();
  $("#rqty").textContent=rq.toLocaleString();
  $("#bqty").textContent=bq.toLocaleString();
  $("#rdetailunit").textContent=r.toFixed(1);
  $("#bdetailunit").textContent=b.toFixed(1);

  /*
    総額差:
    内容量の多い商品と同じ量を買った場合に、
    もう一方はいくらになるかを単価から換算し、その差を表示。
    例: 50g/280円 vs 70g/350円
        70gにそろえると 392円 vs 350円 → 42円差。
  */
  const commonQty=Math.max(rq,bq);
  const redAtCommon=(r/base)*commonQty;
  const blueAtCommon=(b/base)*commonQty;
  const totalDiff=Math.abs(redAtCommon-blueAtCommon);

  /*
    お得率:
    高い方の比較単価に対して、安い方が何%安いか。
  */
  const betterRate=(diff/Math.max(r,b))*100;

  const totalText=totalDiff.toLocaleString("ja-JP",{
    minimumFractionDigits:1,
    maximumFractionDigits:1
  });
  const rateText=betterRate.toFixed(1);

  $("#rtotaldiff").textContent=red ? totalText : "";
  $("#btotaldiff").textContent=red ? "" : totalText;
  $("#rrate").textContent=red ? rateText : "";
  $("#brate").textContent=red ? "" : rateText;
show("result");
  confetti();
};
</script>
